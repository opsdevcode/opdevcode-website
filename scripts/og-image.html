<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG Image - OpsDevCode 1200x630</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        color: #0a2540;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
      }
      .kicker {
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8898aa;
        font-weight: 600;
      }
      h1 {
        font-size: 48px;
        letter-spacing: -0.045em;
        line-height: 1.08;
        font-weight: 750;
        max-width: 14ch;
      }
      h1 span {
        color: #635bff;
      }
      .products {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        border-top: 1px solid #e6ebf1;
        padding-top: 28px;
      }
      .products strong {
        display: block;
        font-size: 20px;
        letter-spacing: -0.03em;
        margin-bottom: 6px;
      }
      .products span {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8898aa;
        font-weight: 600;
      }
      .url {
        font-size: 16px;
        color: #8898aa;
      }
    </style>
  </head>
  <body>
    <p class="kicker">OpsDevCode</p>
    <h1>Infrastructure for modern engineering organizations<span>.</span></h1>
    <div class="products" aria-hidden="true">
      <p><strong>Repave</strong><span>Available</span></p>
      <p><strong>Overpass</strong><span>In development</span></p>
      <p><strong>Toll</strong><span>In development</span></p>
      <p><strong>Dispatch</strong><span>Emerging</span></p>
    </div>
    <p class="url">opsdevco.de</p>
  </body>
</html>
