<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social preview — OpsDevCode 1200×630</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f6f9fc;
        color: #0a2540;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 56px 72px 48px;
      }
      .brand {
        font-size: 72px;
        font-weight: 750;
        letter-spacing: -0.055em;
        line-height: 1;
      }
      .thesis {
        margin-top: 20px;
        font-size: 24px;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: -0.025em;
        color: #425466;
        max-width: 22ch;
      }
      .thesis span {
        color: #635bff;
      }
      .system {
        position: relative;
        margin-top: 8px;
      }
      .system::before {
        content: '';
        position: absolute;
        left: 10px;
        right: 10px;
        top: 7px;
        height: 1px;
        background: #cfd7df;
      }
      .products {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        position: relative;
      }
      .products p {
        padding-top: 28px;
      }
      .node {
        position: absolute;
        top: 4px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #635bff;
      }
      .products p:nth-child(1) .node {
        left: 0;
      }
      .products p:nth-child(2) .node {
        left: calc(25% + 6px);
      }
      .products p:nth-child(3) .node {
        left: calc(50% + 12px);
      }
      .products p:nth-child(4) .node {
        left: calc(75% + 18px);
      }
      .name {
        display: block;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.035em;
        margin-bottom: 6px;
      }
      .status {
        display: block;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8898aa;
        font-weight: 600;
      }
      .foot {
        display: flex;
        justify-content: flex-end;
        font-size: 15px;
        color: #8898aa;
      }
    </style>
  </head>
  <body>
    <div>
      <p class="brand">OpsDevCode</p>
      <p class="thesis">Infrastructure for modern engineering organizations<span>.</span></p>
    </div>
    <div class="system" aria-hidden="true">
      <div class="products">
        <p>
          <span class="node"></span><span class="name">Repave</span
          ><span class="status">Available</span>
        </p>
        <p>
          <span class="node"></span><span class="name">Overpass</span
          ><span class="status">In development</span>
        </p>
        <p>
          <span class="node"></span><span class="name">Toll</span
          ><span class="status">In development</span>
        </p>
        <p>
          <span class="node"></span><span class="name">Dispatch</span
          ><span class="status">Emerging</span>
        </p>
      </div>
    </div>
    <p class="foot">opsdevco.de</p>
  </body>
</html>
