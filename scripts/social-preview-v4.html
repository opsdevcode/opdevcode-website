<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social preview — OpsDevCode 1200×630</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f6f9fc;
        color: #0a2540;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 48px;
        padding: 64px 72px;
      }
      .kicker {
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8898aa;
        font-weight: 600;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 46px;
        letter-spacing: -0.045em;
        line-height: 1.08;
        font-weight: 750;
        max-width: 12ch;
      }
      h1 span {
        color: #635bff;
      }
      .url {
        margin-top: 36px;
        color: #8898aa;
        font-size: 16px;
      }
      .portfolio {
        align-self: center;
        background: #ffffff;
        border: 1px solid #e6ebf1;
        padding: 8px 0;
      }
      .portfolio-label {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8898aa;
        font-weight: 600;
        padding: 10px 22px 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        gap: 16px;
        padding: 14px 22px;
        border-top: 1px solid #e6ebf1;
      }
      .name {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      .status {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8898aa;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <p class="kicker">OpsDevCode</p>
      <h1>Infrastructure for modern engineering organizations<span>.</span></h1>
      <p class="url">opsdevco.de</p>
    </div>
    <div class="portfolio" aria-hidden="true">
      <p class="portfolio-label">Products</p>
      <div class="row">
        <span class="name">Repave</span>
        <span class="status">Available</span>
      </div>
      <div class="row">
        <span class="name">Overpass</span>
        <span class="status">In development</span>
      </div>
      <div class="row">
        <span class="name">Toll</span>
        <span class="status">In development</span>
      </div>
      <div class="row">
        <span class="name">Dispatch</span>
        <span class="status">Emerging</span>
      </div>
    </div>
  </body>
</html>
