name: Direct Push Guard

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Allow merged PRs; block true direct pushes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOWED_DIRECT_PUSH_USERS: ${{ vars.ALLOWED_DIRECT_PUSH_USERS }}
          COMMITTER_USERNAME: ${{ github.event.head_commit.committer.username }}
        run: node .github/scripts/direct-push-guard.mjs
