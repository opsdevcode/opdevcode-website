name: Version Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show PR commits
        run: git log "origin/${{ github.base_ref }}"..HEAD --pretty=format:'%h %s'

      - name: Check Conventional Commits
        uses: wagoid/commitlint-github-action@9763196e10f27aef304c9b8b660d31d97fce0f99 # wagoid/commitlint-github-action@v5
        with:
          configFile: .commitlintrc.cjs
          helpURL: https://github.com/opsdevcode/opdevcode-website/blob/main/CONTRIBUTING.md#conventional-commits

      - name: Verify version bump
        run: .github/scripts/check-version.sh
