[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  publish = "out"
  command = "npm run build"

[context.branch-deploy]
  publish = "out"
  command = "npm run build"

# Social preview: short URLs → static asset (avoid long /assets/ paths in shares)
[[redirects]]
  from = "/preview-v4.png"
  to = "/assets/preview-v4.png"
  status = 200
  force = true

# Previous short URLs → current asset (cache-bust old links)
[[redirects]]
  from = "/preview-v3.png"
  to = "/assets/preview-v4.png"
  status = 200
  force = true

[[redirects]]
  from = "/preview-v2.png"
  to = "/assets/preview-v4.png"
  status = 200
  force = true

# Redirect old .html URLs to clean URLs
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
[[redirects]]
  from = "/pricing.html"
  to = "/services"
  status = 301
[[redirects]]
  from = "/pricing"
  to = "/services"
  status = 301
[[redirects]]
  from = "/tools.html"
  to = "/products"
  status = 301
  force = true
[[redirects]]
  from = "/tools"
  to = "/products"
  status = 301
  force = true
[[redirects]]
  from = "/agentic.html"
  to = "/products/dispatch"
  status = 301
  force = true
[[redirects]]
  from = "/agentic"
  to = "/products/dispatch"
  status = 301
  force = true
[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
[[redirects]]
  from = "/services/karpenter"
  to = "/services/kubernetes"
  status = 301
[[redirects]]
  from = "/services/cost-scaling"
  to = "/services/finops"
  status = 301
[[redirects]]
  from = "/services/terraform"
  to = "/services/iac"
  status = 301

# Security & transport
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; base-uri 'self'"

# No cache for HTML - force fresh content
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
