<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deliberate inaccessible fixture</title>
  </head>
  <body>
    <!-- Intentionally inaccessible: image without text alternative (WCAG 1.1.1). -->
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />
    <!-- Empty button with no accessible name (WCAG 4.1.2). -->
    <button type="button"></button>
    <a href="#"></a>
  </body>
</html>
